defaults: base.yaml
name: student_fusion
branch: fusion
encoder: fusion                 # la misma cámara que la rama visión, más una rama LiDAR fusionada en el BEV

sensors:
  cameras: [front, front_left, front_right]
  image_size: [160, 288]        # alto x ancho de captura
  lidar: true

bevformer:                      # igual que en student_vision, para que la cámara no sea una variable que cambie
  backbone: cnn_light           # único valor implementado
  backbone_channels: 64
  bev_channels: 128
  num_heads: 4                  # cabezas de atención de la spatial cross-attention
  temporal: false               # true no está implementado y el factory lo rechaza

fusion:
  lidar: rasterized_cnn         # único valor implementado
  lidar_in_channels: 2          # ocupación, altura
  fuser: conv                   # ConvFuser: concatena por canales y aplica convoluciones

train:
  seq_len: 32
  batch_size: 8
  encode_chunk_size: 16
  grad_checkpoint: false
  teacher_checkpoint: checkpoints/teacher.pt
  init_rssm_from_teacher: true    # false = el RSSM del alumno parte de cero
  init_actor_critic_from_teacher: true   # false = el actor y el critic del alumno parten de cero
