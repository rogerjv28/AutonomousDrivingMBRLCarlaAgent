[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adcarla"
version = "0.1.0"
description = "TFM: comparativa vision-only vs. fusión multisensor con RL en CARLA"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["adcarla*"]
